name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Nothing gets write access unless a job asks for it below.
permissions:
  contents: read

jobs:
  release:
    name: Build and release plugin zip
    runs-on: ubuntu-latest
    # Creating the GitHub Release is the only write this workflow needs.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:v2

      # Installs exactly what composer.lock pins: a new dependency release never
      # reaches the zip without a reviewed lock-file change.
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build plugin zip
        # Tag-derived values reach the shell through env, never pasted into the script.
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dist/perimetre-wp-tools
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' --exclude='.DS_Store' --exclude='.gitignore' --exclude='CLAUDE.md' --exclude='/tests' . dist/perimetre-wp-tools/
          cd dist && zip -r "perimetre-wp-tools-${VERSION}.zip" perimetre-wp-tools/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: "Perimetre WP Tools ${{ github.ref_name }}"
          files: dist/perimetre-wp-tools-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
          # A tag like v1.1.0-rc.1 is a prerelease. Sites' update checker follows the
          # latest full release, so a test tag never reaches them.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
