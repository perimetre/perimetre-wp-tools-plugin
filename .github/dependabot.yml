# Proposes updates as pull requests, so pinned actions and locked
# dependencies only change through a reviewed PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly

  # Test tooling has its own composer.json and lock file (see tests/composer.json).
  - package-ecosystem: composer
    directory: /tests
    schedule:
      interval: weekly
